name: CD - Deploy Lambda
run-name: Deploying Lambda with Terraform by ${{ github.actor }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # needed to get the OIDC token for AWS
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: Test the Lambda
        run: |
          aws lambda invoke --function-name aisa-hello-world-snyk response.json
          cat response.json
